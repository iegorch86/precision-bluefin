---
name: Build signed Precision Bluefin image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "**/*.md"
  schedule:
    # Check daily. Scheduled runs skip when this Bluefin release was built.
    - cron: "15 13 * * *"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Check current stable Bluefin NVIDIA image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: read

    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}
      release_id: ${{ steps.base.outputs.release_id }}
      bluefin_image: ${{ steps.base.outputs.bluefin_image }}
      image_name: ${{ steps.image.outputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install image inspection tool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Read image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          source image-template.env
          image_name="${IMAGE_NAME,,}"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Inspect current Bluefin NVIDIA Open stable image
        id: base
        shell: bash
        run: |
          set -euo pipefail

          base_name="ghcr.io/ublue-os/bluefin-nvidia-open"
          skopeo inspect "docker://${base_name}:stable" > /tmp/bluefin.json

          digest="$(jq -r '.Digest // empty' /tmp/bluefin.json)"
          base_version="$(jq -r '.Labels["org.opencontainers.image.version"] // .Labels["ostree.version"] // empty' /tmp/bluefin.json)"

          if [[ -z "$digest" ]]; then
            echo "Bluefin stable digest is missing."
            exit 1
          fi

          if [[ -z "$base_version" ]]; then
            echo "Bluefin stable version label is missing."
            exit 1
          fi

          release_id="${base_version%.0}"
          bluefin_image="${base_name}@${digest}"

          echo "Bluefin stable version: ${base_version}"
          echo "Custom release marker: ${release_id}"
          echo "Pinned base image: ${bluefin_image}"

          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "bluefin_image=${bluefin_image}" >> "$GITHUB_OUTPUT"

      - name: Decide whether this run should build
        id: decision
        env:
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          RELEASE_ID: ${{ steps.base.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail

          # Pushes, pull requests, and manual runs always build from the current
          # exact digest behind Bluefin's stable tag.
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          marker_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:upstream-${RELEASE_ID}"

          if docker manifest inspect "$marker_image" >/dev/null 2>&1; then
            echo "Bluefin release ${RELEASE_ID} was already built."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Bluefin release ${RELEASE_ID} is new for this custom image."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build_push:
    name: Build, publish, sign, and release
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      packages: write
      id-token: write

    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      BLUEFIN_IMAGE: ${{ needs.prepare.outputs.bluefin_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install image inspection tool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just syntax
        run: just check

      - name: Read default tag
        shell: bash
        run: |
          set -euo pipefail
          source image-template.env
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "$GITHUB_ENV"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Build pinned Bluefin stable image
        shell: bash
        run: |
          set -euo pipefail

          sudo podman build \
            --pull=newer \
            --build-arg "BLUEFIN_IMAGE=${BLUEFIN_IMAGE}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=Personal Bluefin NVIDIA workstation image" \
            --label "org.opencontainers.image.version=${RELEASE_ID}" \
            --label "io.iegorch86.bluefin.release=${RELEASE_ID}" \
            --tag "${IMAGE_NAME}:${DEFAULT_TAG}" \
            --file Containerfile \
            .

      - name: Rechunk image for resumable updates
        shell: bash
        run: |
          sudo -E $(command -v just) ostree-rechunk \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          build_date="$(date -u +%Y%m%d)"

          tags=(
            "${DEFAULT_TAG}"
            "upstream-${RELEASE_ID}"
            "${DEFAULT_TAG}-${build_date}"
            "${DEFAULT_TAG}-${short_sha}"
            "${DEFAULT_TAG}-${build_date}-${short_sha}"
          )

          printf '%s\n' "${tags[@]}" | sort -u > /tmp/image-tags
          echo "Tags:"
          cat /tmp/image-tags

      - name: Apply image tags
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(sudo podman inspect "${IMAGE_NAME}:${DEFAULT_TAG}" --format '{{.Id}}')"

          while IFS= read -r tag; do
            sudo podman tag "$image_id" "${IMAGE_NAME}:${tag}"
          done < /tmp/image-tags

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push all tags to GHCR
        id: push
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          set -euo pipefail

          authfile="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          test -r "$authfile"

          while IFS= read -r tag; do
            delay=60

            for attempt in 1 2 3 4; do
              if sudo podman push \
                --authfile "$authfile" \
                "${IMAGE_NAME}:${tag}" \
                "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"; then
                break
              fi

              if [[ "$attempt" -eq 4 ]]; then
                echo "Failed to push ${tag} after ${attempt} attempts."
                exit 1
              fi

              echo "Push of ${tag} failed. Waiting ${delay}s before retry..."
              sleep "$delay"
              delay=$((delay * 2))
            done
          done < /tmp/image-tags

          digest="$(
            skopeo inspect \
              --format '{{.Digest}}' \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}"
          )"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid published digest: $digest"
            exit 1
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published registry digest: ${digest}"

      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign published image digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Verify published image signature
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="stable-${RELEASE_ID}"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${release_tag} already exists."
            exit 0
          fi

          current_components="/tmp/precision-packages.json"
          previous_components="/tmp/previous-precision-packages.json"
          component_list="/tmp/precision-components.txt"
          component_rows="/tmp/precision-component-rows.md"
          component_notes="/tmp/precision-component-notes.md"

          echo '{}' > "$current_components"
          : > "$component_list"

          add_component() {
            local component="$1"
            local version="$2"

            jq \
              --arg component "$component" \
              --arg version "$version" \
              '. + {($component): $version}' \
              "$current_components" > "${current_components}.new"
            mv "${current_components}.new" "$current_components"
            printf '%s\n' "$component" >> "$component_list"
          }

          while IFS= read -r package; do
            [[ -z "$package" || "$package" == \#* ]] && continue

            version="$(
              sudo podman run --rm \
                --entrypoint /usr/bin/rpm \
                "${IMAGE_NAME}:${DEFAULT_TAG}" \
                -q --qf '%{VERSION}-%{RELEASE}' "$package" \
                2>/dev/null || true
            )"

            if [[ -z "$version" ]]; then
              echo "Tracked package not installed: ${package}"
              continue
            fi

            add_component "$package" "$version"
          done < build_files/release-packages.txt

          while IFS='|' read -r component metadata; do
            version="$(
              sudo podman run --rm \
                --entrypoint /usr/bin/jq \
                "${IMAGE_NAME}:${DEFAULT_TAG}" \
                -r '."version-name" // .version // empty | tostring' \
                "$metadata" \
                2>/dev/null || true
            )"

            if [[ -z "$version" ]]; then
              echo "Unable to determine extension version: ${component}"
              continue
            fi

            add_component "$component" "$version"
          done <<'EOF_EXTENSIONS'
          Tiling Shell|/usr/share/gnome-shell/extensions/tilingshell@ferrarodomenico.com/metadata.json
          Window State Manager|/usr/share/gnome-shell/extensions/window-state-manager@kishorv06.github.io/metadata.json
          EOF_EXTENSIONS

          previous_release_tag="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
              --jq .tag_name 2>/dev/null || true
          )"

          have_previous=false
          if [[ -n "$previous_release_tag" ]]; then
            mkdir -p /tmp/previous-precision-release
            if gh release download "$previous_release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern precision-packages.json \
              --dir /tmp/previous-precision-release >/dev/null 2>&1; then
              cp /tmp/previous-precision-release/precision-packages.json "$previous_components"
              have_previous=true
            fi
          fi

          if [[ "$have_previous" == true ]]; then
            : > "$component_rows"
            changes=0

            while IFS= read -r component; do
              previous="$(jq -r --arg component "$component" '.[$component] // empty' "$previous_components")"
              current="$(jq -r --arg component "$component" '.[$component] // empty' "$current_components")"

              [[ "$previous" == "$current" ]] && continue

              if [[ -z "$previous" && -n "$current" ]]; then
                printf '| ✨ | `%s` |  | `%s` |\n' "$component" "$current" >> "$component_rows"
              elif [[ -n "$previous" && -z "$current" ]]; then
                printf '| ❌ | `%s` | `%s` |  |\n' "$component" "$previous" >> "$component_rows"
              else
                printf '| 🔄 | `%s` | `%s` | `%s` |\n' "$component" "$previous" "$current" >> "$component_rows"
              fi

              changes=$((changes + 1))
            done < "$component_list"

            {
              echo '### Precision-layer component changes'
              echo
              if [[ "$changes" -eq 0 ]]; then
                echo 'No tracked Precision-layer component versions changed since the previous Precision Bluefin release.'
              else
                echo '| | Component | Previous | New |'
                echo '| --- | --- | --- | --- |'
                cat "$component_rows"
              fi
            } > "$component_notes"
          else
            {
              echo '### Precision-layer component versions'
              echo
              echo 'Initial component-version baseline for automated Precision Bluefin changelogs.'
              echo
              echo '| Component | Version |'
              echo '| --- | --- |'

              while IFS= read -r component; do
                version="$(jq -r --arg component "$component" '.[$component] // empty' "$current_components")"
                [[ -z "$version" ]] && continue
                printf '| `%s` | `%s` |\n' "$component" "$version"
              done < "$component_list"
            } > "$component_notes"
          fi

          upstream_date="${RELEASE_ID#*.}"
          upstream_date="${upstream_date%%.*}"
          upstream_release_tag="stable-${upstream_date}"

          gh api "repos/ublue-os/bluefin/releases/tags/${upstream_release_tag}" \
            --jq .body > /tmp/upstream-release.md

          awk '/^### How to rebase$/ { exit } { print }' \
            /tmp/upstream-release.md > /tmp/upstream-changelog.md

          {
            cat <<EOF_NOTES
          ## Precision Bluefin ${RELEASE_ID}

          Personal Bluefin NVIDIA Open workstation image based on upstream Bluefin ${RELEASE_ID}.

          EOF_NOTES
            cat "$component_notes"
            cat <<EOF_NOTES

          ### Container images

          Current stable image:

          \`\`\`text
          ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:stable
          \`\`\`

          Release-specific image:

          \`\`\`text
          ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:upstream-${RELEASE_ID}
          \`\`\`

          Published digest:

          \`\`\`text
          ${DIGEST}
          \`\`\`

          ---

          ## Upstream Bluefin ${RELEASE_ID} changelog

          EOF_NOTES
            cat /tmp/upstream-changelog.md
            cat <<EOF_NOTES

          > Upstream changelog imported automatically from the corresponding Universal Blue Bluefin release:
          > https://github.com/ublue-os/bluefin/releases/tag/${upstream_release_tag}
          EOF_NOTES
          } > /tmp/release-notes.md

          gh release create "$release_tag" \
            /tmp/precision-packages.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${RELEASE_ID}: Precision Bluefin Stable" \
            --notes-file /tmp/release-notes.md \
            --latest
